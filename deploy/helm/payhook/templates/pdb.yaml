{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "payhook.fullname" . }}-api
  labels: {{- include "payhook.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "payhook.selector" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
