{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payhook.secretName" . }}
  labels: {{- include "payhook.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseURL is required (or set existingSecret)" .Values.secrets.databaseURL | quote }}
  PAYHOOK_WEBHOOK_SECRETS: {{ .Values.secrets.webhookSecrets | quote }}
  PAYHOOK_CALLBACK_SECRET: {{ .Values.secrets.callbackSecret | quote }}
{{- end }}
