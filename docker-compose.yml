x-app: &app
  build: .
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://payhook:payhook@postgres:5432/payhook?sslmode=disable
    NATS_URL: nats://nats:4222
    PAYHOOK_WEBHOOK_SECRETS: halyk=whsec_local_halyk,kaspi=whsec_local_kaspi
    PAYHOOK_CALLBACK_SECRET: whsec_local_callback
  depends_on:
    postgres: { condition: service_healthy }
    nats: { condition: service_started }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payhook
      POSTGRES_PASSWORD: payhook
      POSTGRES_DB: payhook
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payhook"]
      interval: 2s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]

  api:
    <<: *app
    command: ["api"]
    ports: ["${API_PORT:-8080}:8080"]

  relay:
    <<: *app
    command: ["relay"]

  worker:
    <<: *app
    command: ["worker"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

volumes:
  pgdata:
  natsdata:
